
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Mini</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f2f5;
      padding: 50px 20px;
    }
    .logo {
      background: #1877f2;
      color: white;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      font-size: 70px;

      margin: 20px auto;
    }
    h1 { color: #1877f2; }

    a {
      display: inline-block;
      background: #1877f2;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }

<body>
  <div class="logo">f</div>
  <h1>Facebook Mini</h1>

</html>
